name: Deploy game-v2 preview

on:
  push:
    branches:
      - game-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-v2-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout game-v2
        uses: actions/checkout@v4
        with:
          ref: game-v2
          path: app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build preview
        working-directory: app
        run: npm run build

      - name: Checkout current GitHub Pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Update only /v2 preview
        run: |
          rm -rf pages/v2
          mkdir -p pages/v2
          cp -R app/dist/. pages/v2/

      - name: Publish preview without touching production root
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          if git diff --cached --quiet; then
            echo "No preview changes to publish."
          else
            git commit -m "preview: deploy game-v2"
            git push origin gh-pages
          fi
