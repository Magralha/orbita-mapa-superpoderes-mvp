name: qa full game e2e

on:
  push:
    branches:
      - qa/e2e-full-game
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate and build
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/orbita-preview.log 2>&1 &
          echo $! > /tmp/orbita-preview.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/orbita-preview.log
          exit 1

      - name: Run full browser QA
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: node scripts/e2e-full-game.mjs

      - name: Preview logs on failure
        if: failure()
        run: cat /tmp/orbita-preview.log || true
